name: Offline acceptance checks
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q -m "not real_retrieval" --junitxml=eval/results/ci-tests.xml
      - run: python -m eval.run --output eval/results/ci-offline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ matrix.os }}
          path: eval/results/
