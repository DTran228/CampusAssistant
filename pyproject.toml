[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-scout"
version = "0.1.0"
description = "Local campus evidence search and deterministic calendar planning"
requires-python = ">=3.11,<3.14"
dependencies = [
  "Flask==3.1.2", "pydantic==2.12.5", "mcp==1.26.0",
  "icalendar==6.3.2", "python-dateutil==2.9.0.post0", "pypdf==6.6.2",
  "tzdata==2025.3", "httpx==0.28.1"
]
[project.optional-dependencies]
test = ["pytest==8.4.2"]
retrieval = ["sentence-transformers==5.2.0", "faiss-cpu==1.13.2", "numpy==2.2.6", "requests==2.32.5"]
llm = ["llama-cpp-python==0.3.16"]
[project.scripts]
campus-scout = "campus_assistant.cli:main"
[tool.setuptools.packages.find]
include = ["campus_assistant*"]
[tool.setuptools.package-data]
campus_assistant = ["migrations/*.sql"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_retrieval: requires downloaded real embedding model"]
